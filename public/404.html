<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable – 404</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f7fa;
      font-family: "Inter", Roboto, Helvetica, Arial, sans-serif;
      color: #2d3436;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 500px;
      padding: 40px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-size: 4rem;
      font-weight: 800;
      color: #007bff;
      margin-bottom: 10px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .description {
      font-size: 1rem;
      color: #636e72;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #005fcc;
    }

    .illustration {
      width: 180px;
      margin: 0 auto 20px;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .container {
        box-shadow: none;
        border-radius: 0;
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img class="illustration" src="https://cdn-icons-png.flaticon.com/512/580/580185.png" alt="404 illustration" />

    <div class="error-code">404</div>
    <div class="title">Page introuvable</div>

    <p class="description">
      Oups… La page que vous cherchez n’existe pas ou a été déplacée.<br />
      Vérifiez l’URL ou revenez à l’accueil.
    </p>

    <a href="/" class="btn">Retour à l’accueil</a>
  </div>
</body>

</html>
